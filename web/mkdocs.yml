site_name: BtoM —— 反演磁铁内部磁化强度分布
site_description: 用外部磁场测量数据反推磁铁内部的磁化强度分布：偶极正演的离散、体积加权正则化、对称面自动检测与网格无关性
site_author: 134zhou
# 部署地址：https://134zhou.github.io/BtoM/
site_url: https://134zhou.github.io/BtoM/
repo_url: https://github.com/134zhou/BtoM
repo_name: 134zhou/BtoM
edit_uri: edit/main/web/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - 首页: index.md
  - 反演方法（B2M）: b2m.md
  - 对称面检测与镜像: symmetry.md
  - 理论推导: theory.md
  - 实验说明与结论: experiments.md
  - 判据汇总: experiment-results.md
  - 数据集与结果: datasets.md
  - 复现指南: reproduce.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
